"52" y2="58" stroke="#888" stroke-width="2"/><g id="trampolineJumper"><rect x="27" y="14" width="10" height="8" fill="#ffd8b0" stroke="#0b1220" stroke-width="2"/><rect x="26" y="22" width="12" height="10" fill="#ff8686" stroke="#0b1220" stroke-width="2"/><rect x="18" y="18" width="8" height="3" fill="#ffd8b0" stroke="#0b1220" stroke-width="2"/><rect x="38" y="18" width="8" height="3" fill="#ffd8b0" stroke="#0b1220" stroke-width="2"/><rect x="27" y="32" width="4" height="8" fill="#0b1220" stroke="#0b1220" stroke-width="1"/><rect x="33" y="32" width="4" height="8" fill="#0b1220" stroke="#0b1220" stroke-width="1"/></g><animateTransform href="#trampolineJumper" attributeName="transform" type="translate" values="0,22; 0,0; 0,22" keyTimes="0;0.4;1" dur="0.8s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/></svg><div class="speech-bubble" id="bubbleLeft"></div><div class="speech-bubble" id="bubbleRight"></div><div class="speech-bubble" id="bubbleCashier"></div><div class="speech-bubble above-client" id="bubbleClient"></div></div></section><aside class="right"><section class="frame panel"><h2></h2><div class="story" id="story">Нажми PRESS START, чтобы начать.</div><div class="choices" id="choices"></div></section><section class="frame panel side-dialog" id="sideDialog"><div class="dialog-title" id="dialogTitle"></div><div class="dialog-lines" id="dialogLines"></div><div class="dialog-actions" id="dialogActions"></div></section><section class="frame panel"><h3></h3><div class="status-grid" id="statusGrid"></div></section><section class="frame panel"><h3></h3><div class="chat" id="chat"></div></section></aside></main><script>const s=k=>document.querySelector(k);const els={story:s('#story'),choices:s('#choices'),statusGrid:s('#statusGrid'),chat:s('#chat'),phaseChip:s('#phaseChip'),routeChip:s('#routeChip'),targetChip:s('#targetChip'),startOverlay:s('#startOverlay'),pressStartBtn:s('#pressStartBtn'),sideDialog:s('#sideDialog'),dialogLines:s('#dialogLines'),dialogTitle:s('#dialogTitle'),dialogActions:s('#dialogActions'),client:s('#client'),leftOperator:s('#leftOperator'),rightOperator:s('#rightOperator'),cashierNpc:s('#cashierNpc'),world:s('#world'),bubbleLeft:s('#bubbleLeft'),bubbleRight:s('#bubbleRight'),bubbleCashier:s('#bubbleCashier'),bubbleClient:s('#bubbleClient'),crowd1:s('#crowd1'),crowd2:s('#crowd2'),crowdBubble:s('#crowdBubble'),splashLeft:s('#splashLeft'),splashRight:s('#splashRight')};const pts={gate:{x:'15%',y:'82%'},leftOp:{x:'33%',y:'25%'},cashier:{x:'49.5%',y:'58%'},rightOp:{x:'84%',y:'25%'},exitLeft:{x:'8%',y:'-12%'},exitRight:{x:'104%',y:'4%'},payWait:{x:'42%',y:'70%'}};const state={phase:'',route:null,target:'',paid:false,finished:false};let bubbleTimers={};function showBubble(who,text,duration=2800){const map={left:{el:els.bubbleLeft,anchor:els.leftOperator},right:{el:els.bubbleRight,anchor:els.rightOperator},cashier:{el:els.bubbleCashier,anchor:els.cashierNpc},client:{el:els.bubbleClient,anchor:els.client}};const item=map[who];if(!item)return;const el=item.el,anchor=item.anchor;const worldRect=els.world.getBoundingClientRect();const anchorRect=anchor.getBoundingClientRect();const cx=anchorRect.left-worldRect.left+anchorRect.width/2;const ty=anchorRect.top-worldRect.top;if(who==='client'){el.style.left=cx+'px';el.style.top=(ty+anchorRect.height+14)+'px';el.style.transform='translateX(-50%)'}else{el.style.left=cx+'px';el.style.top=(ty-14)+'px';el.style.transform='translate(-50%,-100%)'}el.textContent=text;el.classList.add('visible');if(bubbleTimers[who])clearTimeout(bubbleTimers[who]);if(duration>0)bubbleTimers[who]=setTimeout(()=>hideBubble(who),duration)}function hideBubble(who){const el={left:els.bubbleLeft,right:els.bubbleRight,cashier:els.bubbleCashier,client:els.bubbleClient}[who];if(el)el.classList.remove('visible');if(bubbleTimers[who]){clearTimeout(bubbleTimers[who]);delete bubbleTimers[who]}}function splashWater(side){const el=side==='left'?els.splashLeft:els.splashRight;if(!el)return;el.classList.remove('active');void el.offsetWidth;el.classList.add('active');setTimeout(()=>el.classList.remove('active'),560)}let crowdIdleTimer=null;function positionCrowdBubble(){const worldRect=els.world.getBoundingClientRect();const a=els.crowd1.getBoundingClientRect();const b=els.crowd2.getBoundingClientRect();const cx=((a.left+a.width/2)+(b.left+b.width/2))/2-worldRect.left;const ty=Math.min(a.top,b.top)-worldRect.top;els.crowdBubble.style.left=cx+'px';els.crowdBubble.style.top=(ty-10)+'px'}function cheerCrowd(duration=1400){positionCrowdBubble();els.crowd1.classList.add('crowd-jump');els.crowd2.classList.add('crowd-jump');els.crowdBubble.classList.add('visible');setTimeout(()=>{els.crowd1.classList.remove('crowd-jump');els.crowd2.classList.remove('crowd-jump');els.crowdBubble.classList.remove('visible')},duration)}function startCrowdIdle(){if(crowdIdleTimer)clearInterval(crowdIdleTimer);crowdIdleTimer=setInterval(()=>{if(els.startOverlay.classList.contains('hidden')){const pick=Math.random();if(pick<0.5){els.crowd1.classList.add('crowd-jump');setTimeout(()=>els.crowd1.classList.remove('crowd-jump'),420)}else{els.crowd2.classList.add('crowd-sway');setTimeout(()=>els.crowd2.classList.remove('crowd-sway'),620)}}},2600)}function hideAllBubbles(){['left','right','cashier','client'].forEach(hideBubble);els.crowdBubble.classList.remove('visible');els.crowd1.classList.remove('crowd-jump','crowd-sway');els.crowd2.classList.remove('crowd-jump','crowd-sway')}function moveInstant(node,x,y){node.style.transition='none';node.style.left=x;node.style.top=y;node.getBoundingClientRect();node.style.transition='left 1.5s steps(20), top 1.5s steps(20), opacity .2s linear'}function move(node,x,y,ms=1500){return new Promise(r=>{node.style.left=x;node.style.top=y;setTimeout(r,ms)})}function setStory(text,buttons=[]){els.story.textContent=text;els.choices.innerHTML='';buttons.forEach(b=>{const btn=document.createElement('button');btn.className='btn '+b.className;btn.textContent=b.label;btn.onclick=b.onClick;els.choices.appendChild(btn)})}function log(role,text,kind='bot'){const d=document.createElement('div');d.className='msg '+kind;d.textContent=role?role+': '+text:text;els.chat.prepend(d)}function update(){els.phaseChip.textContent=state.phase||'—';els.routeChip.textContent=state.route||'—';els.targetChip.textContent=state.target||'—';const rows=[['Фаза',state.phase],['Трасса',state.route],['Оплачено',state.paid?'✓ Да':'Нет'],['Завершено',state.finished?'✓ Да':'Нет'],['Цель',state.target],['','']];els.statusGrid.innerHTML=rows.map(([k,v])=>`<div class="status"><strong>${k}</strong>${v||''}</div>`).join('')}function showDialog(title,lines,buttons){els.dialogTitle.textContent=title;els.dialogLines.innerHTML=lines.map(([sp,txt,hl])=>`<div class="dialog-line${hl?' highlight':''}"><span class="dialog-speaker">${sp}</span><span class="dialog-text">${txt}</span></div>`).join('');els.dialogActions.innerHTML='';buttons.forEach(b=>{const btn=document.createElement('button');btn.className='btn '+b.className;btn.textContent=b.label;btn.onclick=b.onClick;els.dialogActions.appendChild(btn)});els.sideDialog.classList.add('active')}function hideDialog(){els.sideDialog.classList.remove('active')}function resetSafe(){state.phase='';state.route=null;state.target='';state.paid=false;state.finished=false;els.chat.innerHTML='';moveInstant(els.client,pts.gate.x,pts.gate.y);els.client.classList.remove('hidden','riding');hideDialog();hideAllBubbles();update()}async function startGame(){els.startOverlay.classList.add('hidden');resetSafe();startCrowdIdle();state.phase='Регистрация';state.target='Оператор кольца';update();setStory('Клиент заходит в парк и идёт к оператору кольцевой трассы.');await move(els.client,pts.leftOp.x,'38%',1400);await move(els.client,pts.leftOp.x,'33%',900);log('Клиент','Хочу покататься!','user');showBubble('client','Хочу покататься!',2600);await new Promise(r=>setTimeout(r,600));showBubble('left','Кольцо или реверс?',3000);log('Оператор','Привет! Куда хочешь? Кольцо или реверс?','bot');state.phase='Выбор трассы';state.target='Выбрать трассу';update();showDialog('Оператор кольца',[['Оператор','Привет! Куда хочешь?',false],['Оператор','Кольцо или реверс?',true]],[{label:'🔵 Кольцевая трасса',className:'ring',onClick:()=>{hideDialog();hideAllBubbles();chooseRoute('Кольцо')}},{label:'🔴 Реверс трасса',className:'reverse',onClick:()=>{hideDialog();hideAllBubbles();chooseRoute('Реверс')}}]);setStory('Оператор предлагает выбрать трассу: кольцо или реверс.')}async function chooseRoute(route){state.route=route;state.phase='Оплата';state.target='Касса';update();log('Клиент',route+'!','user');log('Оператор','Отлично! Иди на кассу.','bot');showBubble('client',route+'!',1800);await new Promise(r=>setTimeout(r,400));showBubble('left','На кассу →',2400);showDialog('Выбор трассы',[['Клиент',route+'?',false],['Оператор','Иди на кассу, там оплатишь.',true]],[{label:'💰 Идти на кассу',className:'primary',onClick:async()=>{hideDialog();hideAllBubbles();setStory('Клиент идёт на кассу оплачивать.');await move(els.client,pts.payWait.x,'70%',1200);await move(els.client,pts.cashier.x,'68%',900);await cashierStage();}}]);setStory('Клиент идёт на кассу.')}async function cashierStage(){state.phase='Оплата';state.target='Касса';update();const text=state.route==='Кольцо'?'Кольцо, пожалуйста':'Реверс, пожалуйста';log('Клиент',text,'user');log('Кассир','Принято! Оплата прошла ✓','bot');showBubble('client',text,2300);await new Promise(r=>setTimeout(r,700));showBubble('cashier','Оплата ✓ / Вперёд!',2800);state.paid=true;update();showDialog('Касса',[['Клиент',text,false],['Кассир','Принято! Оплата прошла ✓',true],['Кассир','Иди к оператору трассы.',false]],[{label:'🏄 К трассе!',className:'primary',onClick:()=>{hideDialog();hideAllBubbles();finalRide();}}]);setStory('Оплата прошла. Иди к оператору трассы!')}async function finalRide(){state.phase='Катание';state.target=state.route==='Кольцо'?'Оператор кольца':'Оператор реверса';update();if(state.route==='Кольцо'){await move(els.client,pts.leftOp.x,'38%',1400);await move(els.client,pts.leftOp.x,'33%',900);showBubble('client','Готов!',1700);await new Promise(r=>setTimeout(r,500));showBubble('left','Поехали! 🤙',2200);cheerCrowd(1600);splashWater('left');log('Клиент','Готов!','user');state.phase='В воде!';state.finished=true;update();showDialog('🏄 Поехали!',[['Оператор','Готов?',false],['Клиент','Да!',false],['Оператор','ПОЕХАЛИ! 🤙',true]],[]);await new Promise(r=>setTimeout(r,1400));hideDialog();hideAllBubbles();els.client.classList.add('riding');await move(els.client,pts.exitLeft.x,pts.exitLeft.y,1400);els.client.classList.remove('riding')}else{await move(els.client,'74%','38%',1400);await move(els.client,pts.rightOp.x,'33%',900);showBubble('client','Готов!',1700);await new Promise(r=>setTimeout(r,500));showBubble('right','Реверс! 🤙',2200);cheerCrowd(1600);splashWater('right');log('Клиент','Готов!','user');state.phase='В воде!';state.finished=true;update();showDialog('🏄 Реверс!',[['Оператор','Готов к реверсу?',false],['Клиент','Да!',false],['Оператор','РЕВЕРС, ВПЕРЁД! 🤙',true]],[]);await new Promise(r=>setTimeout(r,1400));hideDialog();hideAllBubbles();els.client.classList.add('riding');await move(els.client,pts.exitRight.x,pts.exitRight.y,1400);els.client.classList.remove('riding')}setStory('Клиент уехал кататься! 🏄 Хочешь запустить снова?',[{label:'🔄 Заново',className:'primary',onClick:startGame}])}setStory('Нажми PRESS START, чтобы начать.');els.pressStartBtn.addEventListener('click',startGame);els.startOverlay.addEventListener('click',e=>{if(e.target===els.startOverlay)startGame()});resetSafe();startCrowdIdle();</script></body></html>
